
name: Build TriPoint iOS Bluetooth

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Bluetooth branch
        uses: actions/checkout@v4
        with:
          ref: bluetooth-development

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Set up Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
       - name: Check Expo configuration
        run: npx expo config --json
      - name: Build iPhone development app
        run: eas build --platform ios --profile development --non-interactive --no-wait
